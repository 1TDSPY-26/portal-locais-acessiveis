name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: lint-build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js com cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalação limpa de dependências
        run: npm ci

      - name: Validação de lint
        run: npm run lint

      - name: Build da aplicação
        run: npm run build

      - name: Execução de testes
        # --if-present evita que o CI quebre enquanto a Issue #11 (testes automatizados) não existir
        run: npm run test --if-present